# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable data.sql for tests
spring.sql.init.mode=never

# File upload for tests
file.upload-dir=target/test-uploads

# Logging
logging.level.root=WARN
logging.level.be.vives.pizzastore=INFO

# Quiet expected noise: the exception handler logs every handled error, and Spring Data warns about page serialization
logging.level.be.vives.pizzastore.exception.GlobalExceptionHandler=OFF
logging.level.org.springframework.data.web.config=ERROR

# Open Food Facts: tests never call the real server (.invalid can never resolve); OpenFoodFactsClientTest uses a mock server
spring.http.serviceclient.openfoodfacts.base-url=http://openfoodfacts.invalid
