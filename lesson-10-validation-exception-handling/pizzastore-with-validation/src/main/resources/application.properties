# Application Name
spring.application.name=pizzastore-with-validation

# Server Configuration
server.port=8080

# Data Source Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:pizzastore_validation
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - browse the loaded data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Run data.sql after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# Logging Configuration
logging.level.be.vives.pizzastore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Jackson Configuration (JSON)
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Europe/Brussels

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/pizzas
file.base-url=http://localhost:8080
