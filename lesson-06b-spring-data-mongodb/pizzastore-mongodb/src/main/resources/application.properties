# Application Name
spring.application.name=pizzastore-mongodb

# Server Configuration
server.port=8080

# MongoDB Connection
# Requires a running MongoDB instance, e.g.:
#   docker run -d --name pizzastore-mongo -p 27017:27017 mongo:7.0
spring.data.mongodb.uri=mongodb://localhost:27017/pizzastore_dev

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
