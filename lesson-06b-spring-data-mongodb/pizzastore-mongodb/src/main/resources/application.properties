# Application Name
spring.application.name=pizzastore-mongodb

# Server Configuration
server.port=8080

# MongoDB Connection
# Requires a running MongoDB instance, e.g.:
#   docker run -d --name pizzastore-mongo -p 27017:27017 mongo:7.0
# Spring Boot 4 name: spring.mongodb.uri. The Spring Boot 3 name spring.data.mongodb.uri is ignored,
# and the application would silently use the default mongodb://localhost/test instead.
spring.mongodb.uri=mongodb://localhost:27017/pizzastore_dev

# Create the indexes declared with @Indexed at startup (off by default since Spring Data MongoDB 3.0)
spring.data.mongodb.auto-index-creation=true

# Store BigDecimal (prices) as BSON Decimal128, a real decimal number, so price queries compare numbers.
# Spring Boot 4 already does this by default; Spring Boot 3 stored BigDecimal as a String ("10.99" < "8.99").
spring.data.mongodb.representation.big-decimal=decimal128

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
