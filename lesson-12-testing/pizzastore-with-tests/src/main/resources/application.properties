# Application Name
spring.application.name=pizzastore-with-tests

# Server Configuration
server.port=8080

# Data Source Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:pizzastore_tests
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - browse the loaded data at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Run data.sql after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# Logging Configuration
logging.level.be.vives.pizzastore=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Jackson Configuration (JSON)
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Europe/Brussels

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads/pizzas
file.base-url=http://localhost:8080

# Open Food Facts (declarative HTTP client, group "openfoodfacts" - see HttpClientConfig)
# Open Food Facts requires a User-Agent of the form AppName/Version (contact), and allows 15 product lookups per minute per IP
spring.http.serviceclient.openfoodfacts.base-url=https://world.openfoodfacts.org
spring.http.serviceclient.openfoodfacts.default-header.User-Agent=PizzaStore/1.0 (pizzastore-course@example.com)
spring.http.serviceclient.openfoodfacts.connect-timeout=2s
spring.http.serviceclient.openfoodfacts.read-timeout=5s
